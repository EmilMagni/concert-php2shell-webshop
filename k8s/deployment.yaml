apiVersion: apps/v1
kind: Deployment
metadata:
  name: webshop-web
  namespace: webshop
  labels:
    app: webshop-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webshop-web
  template:
    metadata:
      labels:
        app: webshop-web
    spec:
      containers:
        - name: php
          # vulnerable on purpose (PHP2Shell). fix: php:8.3.36-fpm-alpine
          image: docker.io/library/php:8.3.10-fpm-alpine
          command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
          ports:
            - containerPort: 8080
